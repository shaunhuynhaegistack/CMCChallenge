name: PR review gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  review:
    name: Review the diff
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reports, lock files and screenshots add noise without adding signal.
      - name: Build the reviewable diff
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --unified=2 "origin/${{ github.base_ref }}...HEAD" \
            -- . ':(exclude)package-lock.json' ':(exclude)reports/**' > pr.diff
          wc -c pr.diff

      - name: Ask the model
        id: review
        env:
          # First configured provider wins: Greptile, then GitHub Models as the
          # fallback. The fallback needs no secret, but it does need to be told
          # which model to ask - GITHUB_MODEL is a repository *variable* rather
          # than a secret, because a model name is not one.
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
          GITHUB_MODEL: ${{ vars.GITHUB_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_STRICT: 'false'
        run: npx ts-node .github/scripts/pr-review.ts

      # Every result reaches the run summary. Only a result the author can act
      # on - a review, approving or blocking - is also put on the pull request;
      # "no provider configured" is a message for whoever maintains the
      # pipeline, and a comment nobody can act on teaches people to skim past
      # comments.
      - name: Record the result in the run summary
        if: always()
        run: |
          [ -f pr-review-summary.md ] || exit 0
          cat pr-review-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f pr-review.md ] || exit 0
          gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-review.md
